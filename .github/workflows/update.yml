name: Update Persecutio
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  # Serialize with preview.yml / pages.yml writers to gh-pages.
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install --upgrade pip -r requirements.txt
      - name: Fetch external data sources
        id: fetch
        run: |
          FAIL=0
          # Primary sources — failures abort the job before generate/deploy
          python3 scripts/fetch_opendoors.py || FAIL=1
          python3 scripts/fetch_freedom_house.py || FAIL=1
          python3 scripts/fetch_owid.py || FAIL=1
          python3 scripts/fetch_uscirf.py || FAIL=1
          python3 scripts/fetch_state_dept.py || FAIL=1

          # Secondary / flaky sources — enrich when available; never abort deploy
          SEC_FAIL=0
          SEC_FAILED=""
          run_sec() {
            if ! python3 "scripts/$1"; then
              SEC_FAIL=$((SEC_FAIL + 1))
              SEC_FAILED="${SEC_FAILED} $1"
            fi
          }
          run_sec fetch_gdelt.py
          run_sec fetch_ohchr.py
          run_sec fetch_morningstarnews.py
          run_sec fetch_vid.py
          run_sec fetch_gcr_stats.py
          run_sec fetch_acn.py
          run_sec fetch_csw.py
          run_sec fetch_icc.py
          run_sec fetch_forum18.py
          run_sec fetch_mec.py
          run_sec fetch_bitterwinter.py
          run_sec fetch_releaseintl.py
          run_sec fetch_vom.py
          run_sec fetch_chinaaid.py
          run_sec fetch_infochretienne.py
          run_sec fetch_osce.py
          run_sec fetch_unsrforb.py
          run_sec fetch_hrw.py
          run_sec fetch_amnesty.py
          run_sec fetch_barnabas.py
          run_sec fetch_csi.py
          run_sec fetch_cna.py
          run_sec fetch_fides.py
          run_sec fetch_aciprensa.py
          run_sec fetch_hrwf.py
          run_sec fetch_adf.py
          run_sec fetch_wea.py
          run_sec fetch_jubilee.py
          run_sec fetch_ippforb.py

          if [ "$SEC_FAIL" -gt 0 ]; then
            echo "::warning::Secondary fetch failures ($SEC_FAIL):$SEC_FAILED"
            echo "Secondary fetch failures ($SEC_FAIL):$SEC_FAILED"
          else
            echo "All secondary fetches succeeded"
          fi

          # Gate on primary status JSON (ok only — partial/cached abort)
          python3 scripts/check_primary_status.py
          STATUS_FAIL=$?
          if [ "$STATUS_FAIL" -ne 0 ]; then
            FAIL=1
          fi

          echo "fetch_failed=$FAIL" >> "$GITHUB_OUTPUT"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more primary data source fetches failed — aborting before generate/deploy"
            exit 1
          fi
      - run: python3 scripts/collect_data.py
      - run: python3 scripts/generate_website_data.py
      - run: python3 -m py_compile scripts/collect_data.py scripts/generate_website_data.py scripts/fetch_common.py scripts/check_primary_status.py scripts/source_registry.py scripts/fetch_*.py tests/*.py
      - run: python3 -m pytest tests
      - run: |
          test -s data/countries.yml
          test -s data/sources.yml
          test -s assets/data/geojson.json
          test -s assets/data/search.json
          test -s assets/data/meta.json
          COUNTRY_COUNT=$(ls countries/*.html | wc -l)
          GEOJSON_FEATURES=$(python3 -c "import json; print(len(json.load(open('assets/data/geojson.json'))['features']))")
          if [ "$COUNTRY_COUNT" != "$GEOJSON_FEATURES" ]; then
            echo "Country page count '$COUNTRY_COUNT' does not match geojson feature count '$GEOJSON_FEATURES'"
            exit 1
          fi
          for page in countries/*.html; do
            if ! grep -q 'Historical Background' "$page"; then
              echo "Missing Historical Background in $page"
              exit 1
            fi
            if ! grep -q 'Modern-Day Situation' "$page"; then
              echo "Missing Modern-Day Situation in $page"
              exit 1
            fi
            if ! grep -q 'All References</h2>' "$page"; then
              echo "Missing All References section in $page"
              exit 1
            fi
            if ! grep -q 'href="http' "$page"; then
              echo "Missing source links in $page"
              exit 1
            fi
            if grep -q 'href="/persecutio/index.html">Map</a> · <a href="/persecutio/about.html">About</a>' "$page"; then
              echo "Footer navigation still present in $page"
              exit 1
            fi
          done
      - name: Commit and push updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/countries.yml \
            data/sources.yml \
            assets/data/ \
            countries/ \
            index.html \
            about.html \
            faq.html \
            act.html \
            assets/css/ \
            assets/js/ \
            assets/img/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update persecution data and site [skip ci]"
            git push origin HEAD:main
          fi
      - name: Stage public site for Pages
        run: |
          mkdir -p _site
          cp index.html about.html faq.html act.html LICENSE _site/
          cp -R countries assets _site/
          touch _site/.nojekyll
          # Do not publish scrape caches, scripts, tests, or local backups
          find _site/assets -name '*.bak-*' -delete 2>/dev/null || true
          rm -rf _site/assets/data/fetched 2>/dev/null || true
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: _site
          clean: true
          clean-exclude: pr-preview
